    <circle cx="92" cy="92" r="60" fill="none" stroke="#46533e" stroke-width="2" stroke-dasharray="3 9"/>
    <circle cx="92" cy="92" r="42" fill="#20271d"/>
    <path d="M92 48c27 0 49 20 49 44s-22 44-49 44c-9 0-17-2-24-6 12-10 19-23 19-38s-7-28-19-38c7-4 15-6 24-6Z" fill="url(#mark)"/>
