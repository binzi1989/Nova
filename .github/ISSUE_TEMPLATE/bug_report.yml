name: Bug report
description: 报告可复现的功能、稳定性或体验问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 NOVA。请勿在公开 Issue 中提交 API Key、令牌、私钥或私有工作区内容。
  - type: input
    id: version
    attributes:
      label: NOVA 版本
      description: 可在应用顶部状态栏或 Release 文件名中查看
      placeholder: 例如 1.1.0-preview.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows Electron x64
        - Windows WPF x64
        - macOS Apple Silicon
        - macOS Intel
        - 其他
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: 模型或运行时
      description: 不要填写密钥
      placeholder: 例如 DeepSeek / Kimi / Ollama + 模型名称
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 选择工作区……
        2. 输入任务……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附脱敏截图、错误文本和 Crash Report 文件名
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 提交前确认
      options:
        - label: 我已移除密钥、令牌、私钥和私有工作区内容
          required: true
        - label: 我确认该问题可以稳定复现，或已说明复现概率
          required: true
